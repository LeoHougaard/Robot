name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install pinned offline test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --index-url https://pypi.org/simple -r validation/requirements.txt
          python -m pip check
      - name: Prepare checksum-pinned Kotlin host test dependencies
        run: python pixel_robot/tools/run_host_kotlin_tests.py --download-only
      - name: Run the canonical offline validation plan
        run: python -m validation --profile offline --base-ref HEAD --output validation/results/ci
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation-evidence
          path: validation/results/ci/
          if-no-files-found: warn
          retention-days: 7
