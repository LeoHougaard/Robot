params:
  seed: 42

  env:
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -0.5
        fixed_sigma: true
    mlp:
      units: [128, 128, 128]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: false
  load_path: ""

  config:
    name: simple_dog_rough_velocity_direct
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    # The GB10/Blackwell ARM stack can wedge inside the first GradScaler
    # optimizer update when a continued checkpoint enters a new rough-task
    # reward distribution.  This network is small; full precision is stable
    # and the throughput cost is negligible compared with PhysX/ray casting.
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.01
    score_to_win: 1000
    max_epochs: 500
    save_best_after: 10
    save_frequency: 25
    grad_norm: 1.0
    entropy_coef: 0.003
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 4096
    mini_epochs: 5
    critic_coef: 2.0
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.001
