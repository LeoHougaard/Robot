; Tested dependency snapshot for isolated compile-only validation.
; The production platformio.ini is unchanged; do not use an upload target.
[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
platform_packages =
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
  platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
  platformio/tool-esptoolpy@2.41100.260830
  platformio/tool-scons@4.40801.0
monitor_speed = 2000000
upload_speed = 921600
board_build.filesystem = spiffs
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -D ROBOT_DOG_VERSION=\"0.1.17-rxdiag\"
  -D SERVO_UART_NUM=1
  -D SERVO_TX_PIN=19
  -D SERVO_RX_PIN=18
  -D SERVO_BAUD=1000000
  -D IMU_SDA_PIN=32
  -D IMU_SCL_PIN=33
  -D MOTOR_A_PWM_PIN=25
  -D MOTOR_A_IN1_PIN=21
  -D MOTOR_A_IN2_PIN=17
  -D MOTOR_B_PWM_PIN=26
  -D MOTOR_B_IN1_PIN=22
  -D MOTOR_B_IN2_PIN=23

